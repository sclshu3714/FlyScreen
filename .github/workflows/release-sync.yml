name: Sync Release to Gitee
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的tag（例如 v1.0.0）'
        required: true

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Sync GitHub Release to Gitee
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: sclshu3714/FlyScreen
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          # 拉取 GitHub release 信息
          release_info=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          
          name=$(echo "$release_info" | jq -r '.name')
          body=$(echo "$release_info" | jq -r '.body')
          prerelease=$(echo "$release_info" | jq -r '.prerelease')

          # 在Gitee创建发行版
          gitee_resp=$(curl -s -X POST "https://gitee.com/api/v5/repos/$GITEE_REPO/releases" \
            -H "Content-Type: application/json" \
            -d '{
              "access_token": "'"$GITEE_TOKEN"'",
              "tag_name": "'"$TAG"'",
              "name": "'"$(echo "$name" | sed 's/"/\\"/g')"'",
              "body": "'"$(echo "$body" | sed 's/"/\\"/g')"'",
              "prerelease": '"$prerelease"'
            }')
          echo "$gitee_resp"
