name: Sync Release to Gitee
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的tag（例如 v1.0.0）'
        required: true

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Sync GitHub Release to Gitee
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_PAT: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: sclshu3714/FlyScreen
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          # 获取GitHub Release信息
          release_info=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          
          name=$(echo "$release_info" | jq -r '.name')
          body=$(echo "$release_info" | jq -r '.body')
          prerelease=$(echo "$release_info" | jq -r '.prerelease')
          assets=$(echo "$release_info" | jq -c '.assets')

          # Gitee PAT Header鉴权
          gitee_resp=$(curl -s -X POST "https://gitee.com/api/v5/repos/$GITEE_REPO/releases" \
            -H "Authorization: token $GITEE_PAT" \
            -H "Content-Type: application/json" \
            -d '{
              "tag_name": "'"$(echo "$TAG" | sed 's/"/\\"/g')"'",
              "name": "'"$(echo "$name" | sed 's/"/\\"/g')"'",
              "body": "'"$(echo "$body" | sed 's/"/\\"/g')"'",
              "prerelease": '"$prerelease"'
            }')
          echo "$gitee_resp"
          
          if echo "$gitee_resp" | jq -e '.id' >/dev/null; then
            echo "✅ 发行版创建成功"
            release_id=$(echo "$gitee_resp" | jq -r '.id')
            echo "$assets" | jq -r '.[] | @base64' | while read -r asset; do
              _jq() { echo ${asset} | base64 -d | jq -r ${1}; }
              asset_url=$(_jq '.browser_download_url')
              asset_name=$(_jq '.name')
              echo "📥 下载附件 $asset_name"
              curl -sL "$asset_url" -o "$asset_name"
              echo "📤 上传附件"
              curl -s -X POST "https://gitee.com/api/v5/repos/$GITEE_REPO/releases/$release_id/attach_files" \
                -H "Authorization: token $GITEE_PAT" \
                -F "file=@$asset_name"
              rm -f "$asset_name"
            done
          else
            echo "❌ 创建发行版失败"
            exit 1
          fi
