name: Sync Release to Gitee
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的tag名称（如 v1.0.0）'
        required: true
jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Sync GitHub Release to Gitee
        uses: Yikun/gitee-release-sync-action@v1
        with:
          gitee-token: ${{ secrets.GITEE_TOKEN }}
          gitee-repo: sclshu3714/FlyScreen
          tag: ${{ github.event.inputs.tag || github.ref_name }}
